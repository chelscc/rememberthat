<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Remember That">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Remember That</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=Figtree:wght@500;600;700&family=Roboto:wght@400;500;700&family=Grand+Hotel&family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500;600;700&display=swap">
<script src="lucide.min.js"></script>
<script src="supabase.js"></script>
<style>
/* Layout: phone = stacked feed + bottom tab bar with centre capture; desktop = sidebar + wide masonry grid */
:root{
  --bg:#fdf6f8; --surface:#ffffff; --surface-2:#f8ecf1; --ink:#2b1c24; --muted:#7b6670; --line:#efdde5;
  --accent:#c4577a; --on-accent:#ffffff;
  --font-display:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --shadow:0 6px 24px rgba(120,40,70,.10);
}
:root[data-accent="pastel"]{--accent:#f19fbd;--on-accent:#3a1426}
:root[data-accent="hot"]{--accent:#e0307a;--on-accent:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181015; --surface:#231920; --surface-2:#2d2028; --ink:#f8e9ef; --muted:#b89fab; --line:#3a2b33;
  --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-accent="everyone"]{--accent:#2f6bd8;--on-accent:#fff;--bg:#ffffff;--surface:#ffffff;--surface-2:#f2f4f7;--line:#e4e7ec;--ink:#1a1d23;--muted:#667085}
:root[data-accent="white"]{--accent:#c4577a;--on-accent:#fff;--bg:#ffffff;--surface:#ffffff;--surface-2:#f4f3f4;--line:#e9e7e9;--ink:#1e1a1c;--muted:#6f686c}
:root[data-accent="sage"]{--accent:#d0668a;--on-accent:#fff;--bg:#f3f6f1;--surface-2:#e8efe5;--line:#dbe5d6;--ink:#22302a;--muted:#66756c}
:root[data-accent="peach"]{--accent:#ee7a6a;--on-accent:#fff;--bg:#fff6f0;--surface-2:#fdeadf;--line:#f5dccd;--ink:#3a2420;--muted:#86685f}
:root[data-accent="lilac"]{--accent:#c165b9;--on-accent:#fff;--bg:#f7f4fc;--surface-2:#eee8f8;--line:#e2daf0;--ink:#2a2236;--muted:#776c88}
:root[data-theme="dark"]{--bg:#181015;--surface:#231920;--surface-2:#2d2028;--ink:#f8e9ef;--muted:#b89fab;--line:#3a2b33;--shadow:0 6px 24px rgba(0,0,0,.35);color-scheme:dark}
:root[data-accent="midnight"]{--accent:#ff4f9a;--on-accent:#fff;--bg:#140a14;--surface:#21121f;--surface-2:#2c1829;--ink:#fbe8f2;--muted:#c19ab2;--line:#3d2238;--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px;border-radius:10px}
.ico svg{width:20px;height:20px;stroke-width:2}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance}

.app{display:grid;grid-template-columns:1fr;min-height:100%}
.sidebar{display:none}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px;max-width:1180px;width:100%;margin:0 auto}

/* header */
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.top .hello{flex:1;min-width:0}
.hello h1{font-size:26px;line-height:1.15}
.hello p{margin:4px 0 0;color:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.cta{display:none;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);font-weight:800;padding:11px 18px;border-radius:999px}
.proto{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));padding:3px 9px;border-radius:999px;margin-bottom:8px}

.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 16px;height:48px;margin-bottom:18px}
.searchbar input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px}
.searchbar .ico{color:var(--muted)}

.section-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 10px}
.section-h h2{font-size:19px}
.link-btn{color:var(--accent);font-weight:800;font-size:14px}

/* category tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{--c:#888;text-align:left;border-radius:var(--r-md);padding:12px;background:color-mix(in srgb,var(--c) 15%,var(--surface));display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .dot{width:34px;height:34px;border-radius:11px;background:var(--c);color:#fff;display:grid;place-items:center}
.tile .dot svg{width:18px;height:18px}
.tile b{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{color:var(--muted);font-weight:700;font-size:12px;margin-top:-6px}

.inbox-banner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px dashed color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:var(--r-md);padding:12px 14px;margin-bottom:4px}
.inbox-banner .grow{flex:1;min-width:0}
.inbox-banner b{display:block}
.inbox-banner span{color:var(--muted);font-size:13px}
.pill{background:var(--accent);color:var(--on-accent);font-weight:800;border-radius:999px;padding:2px 10px;font-size:13px}

.remember{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface));border-radius:var(--r-lg);padding:14px;margin-top:18px;width:100%;text-align:left}
.remember .thumb{width:64px;height:64px;border-radius:14px;flex:none;overflow:hidden}
.remember small{font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.remember b{display:block;font-family:var(--font-display);font-weight:600;font-size:17px}
.stat{color:var(--muted);font-size:13.5px;margin-top:10px}

/* cards */
.grid{columns:2;column-gap:10px}
.card{break-inside:avoid;margin-bottom:10px;background:var(--surface);border-radius:var(--r-md);overflow:hidden;width:100%;text-align:left;display:block;box-shadow:var(--shadow)}
.ph{--c:#888;position:relative;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c))}
.ph svg{width:30px;height:30px;opacity:.9}
.ph img,.remember img,.hero img{width:100%;height:100%;object-fit:cover;display:block}
.card .body{padding:10px 12px 12px}
.card b{display:block;font-weight:800;font-size:14px;line-height:1.3}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
.chip-c{--c:#888;display:inline-flex;align-items:center;gap:5px;font-weight:800;color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.chip-c::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.sample{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);padding:1px 7px;border-radius:999px}
.stars{color:var(--accent);letter-spacing:1px}
.list .card{display:flex;align-items:center;gap:12px;padding:8px;margin-bottom:8px;box-shadow:none;border:1px solid var(--line)}
.list .ph{width:56px;height:56px!important;border-radius:12px;flex:none}
.list .ph svg{width:22px;height:22px}
.list .card .body{padding:0;min-width:0;flex:1}
.list{columns:1}
.cl-line{margin:4px 0 0;color:var(--muted);font-size:15px}
.empty{text-align:center;padding:40px 16px;color:var(--muted);line-height:1.5}.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:2px}
.empty-ic{--c:var(--accent);display:grid;place-items:center;width:64px;height:64px;margin:0 auto 12px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c);animation:float 3.2s ease-in-out infinite}.empty-ic svg{width:28px;height:28px}
@keyframes float{50%{transform:translateY(-5px)}}@media(prefers-reduced-motion:reduce){.empty-ic{animation:none}}
.empty b{display:block;font-family:var(--font-display);font-weight:600;color:var(--ink);font-size:18px;margin-bottom:4px}

.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{padding:6px 10px;border-radius:999px;display:flex;align-items:center;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.seg svg{width:17px;height:17px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{--c:var(--accent);flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.fchip:disabled{opacity:.5}

.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:800;margin-bottom:8px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.tab[aria-current="page"]{color:var(--accent)}
.tab-plus{justify-self:center;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 45%,transparent);border:4px solid var(--bg)}
.tab-plus svg{width:26px;height:26px;stroke-width:2.6}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(30,10,20,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-radius:26px 26px 0 0;max-height:92%;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-h h2{font-size:21px}
label.f{display:block;font-weight:800;font-size:13px;margin:14px 0 6px}
.in{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:11px 12px;outline:none}
.in:focus{border-color:var(--accent)}
textarea.in{min-height:72px;resize:vertical}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.type{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:var(--r-sm);border:1.5px solid var(--line);font-weight:800;font-size:12.5px}
.type[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--ink)}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:var(--r-sm);padding:18px;color:var(--muted);font-weight:700;cursor:pointer;text-align:center}
.drop img{max-height:160px;border-radius:10px}
.note{font-size:12.5px;color:var(--muted);margin-top:6px}
.ai-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border-radius:var(--r-sm);font-weight:800;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:color-mix(in srgb,var(--accent) 70%,var(--ink));margin-top:14px}
.ai-box{margin-top:10px;border-radius:var(--r-sm);padding:12px;background:var(--surface-2);font-size:14px}
.ai-box .row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 14px;border-radius:999px;font-weight:800;background:var(--surface-2);text-decoration:none;color:var(--ink);font-size:14px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn svg{width:18px;height:18px}
.save-row{display:flex;gap:10px;margin-top:20px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;font-weight:800;font-size:14px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}

.hero{height:200px;border-radius:var(--r-md);overflow:hidden;margin-bottom:14px}
.hero.ph svg{width:44px;height:44px}
.d-title{font-size:23px;margin:6px 0 4px}
.rate button{font-size:26px;color:var(--line);padding:0 2px;line-height:1}
.rate button.on{color:var(--accent)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.dir{display:flex;gap:8px;margin-top:8px}
.kv{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700;font-size:14px;margin-top:8px}
.kv svg{width:16px;height:16px}

/* map */
.map{position:relative;height:min(62vh,520px);border-radius:var(--r-lg);overflow:hidden;background:color-mix(in srgb,#8fc9b0 22%,var(--surface));margin-top:12px;border:1px solid var(--line)}
.map svg.bgmap{position:absolute;inset:0;width:100%;height:100%}
.pin{--c:#888;position:absolute;transform:translate(-50%,-100%);width:34px;height:34px;border-radius:50% 50% 50% 0;rotate:-45deg;background:var(--c);border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25);display:grid;place-items:center}
.pin svg{rotate:45deg;width:15px;height:15px;color:#fff}
.mini{position:absolute;left:12px;right:12px;bottom:12px;background:var(--surface);border-radius:var(--r-md);padding:12px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.mini .ph{width:52px;height:52px;border-radius:12px;flex:none}
.mini .grow{flex:1;min-width:0}

/* collections */
.colls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.coll{background:var(--surface);border-radius:var(--r-md);padding:10px;text-align:left;box-shadow:var(--shadow);min-width:0}
.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:4px;height:96px;border-radius:12px;overflow:hidden;margin-bottom:8px}
.mosaic div{--c:#888;background:color-mix(in srgb,var(--c) 70%,var(--surface))}
.coll b{display:block;font-weight:800}
.coll small{color:var(--muted);font-weight:700}
.newcoll{display:flex;gap:8px;margin-top:12px}

/* settings */
.set-card{background:var(--surface);border-radius:var(--r-md);padding:14px;margin-top:12px;border:1px solid var(--line)}
.set-card h3,.set-card h2{font-size:16px;margin:0 0 8px}
.shades{display:flex;gap:10px;flex-wrap:wrap}
.shade{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:12.5px}
.shade i{width:52px;height:52px;border-radius:16px;display:block;border:3px solid transparent;box-shadow:inset 0 0 0 1px var(--line)}
.shade[aria-pressed="true"] i{border-color:var(--ink)}
.catrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-weight:700}
.catrow:first-of-type{border-top:0}
.catrow .sw-c{width:14px;height:14px;border-radius:50%;flex:none}
.catrow span:last-child{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--accent)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:800;display:flex;gap:8px;align-items:center;opacity:0;pointer-events:none;transition:.22s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spark{position:fixed;z-index:61;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:spark .7s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.view{animation:fade .2s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Pinterest-style feed */
:root[data-style="pin"] .grid .card{background:none;box-shadow:none;position:relative;border-radius:0;overflow:visible}
:root[data-style="pin"] .grid .ph{border-radius:18px;overflow:hidden;transition:filter .15s}
:root[data-style="pin"] .grid .card .body{padding:7px 4px 14px}
:root[data-style="pin"] .grid .card b{font-weight:700;font-size:13.5px}
:root[data-style="pin"] .grid .meta{margin-top:3px}
.pin-save{display:none}
:root[data-style="pin"] .grid .pin-save{display:block;position:absolute;top:10px;right:10px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px;padding:7px 13px;border-radius:999px;opacity:0;transition:opacity .15s}
:root[data-style="pin"] .grid .card:hover .pin-save,:root[data-style="pin"] .grid .card:focus-visible .pin-save{opacity:1}
:root[data-style="pin"] .grid .card:hover .ph{filter:brightness(.88)}
.pin-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand-m{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.pin-hello{margin:0 0 4px;color:var(--muted);font-size:14px}
.pin-hello b{color:var(--ink);font-family:var(--font-display);font-weight:600;font-size:17px}
.pin-chips{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;margin-bottom:6px}
.pin-chips .fchip{border:0;background:none;font-weight:800}
.pin-chips .fchip.pin-on{background:var(--ink);color:var(--bg)}
.pin-grid{column-gap:8px}
@media(min-width:900px){.pin-grid{columns:5}.brand-m{display:none}}

/* Google style */
:root[data-style="google"]{--font-display:"Figtree","Roboto",system-ui,sans-serif;--font-body:"Roboto",system-ui,sans-serif;--r-md:24px;--r-lg:28px}
.g-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.g-search{flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:56px;border-radius:28px;padding:0 8px 0 20px;background:var(--surface-2);color:var(--muted)}

/* desktop */
@media (min-width:900px){
  .app{grid-template-columns:250px 1fr}

/* ===== Design pass, 10 Nov ===== */
/* sentence case: no tracked capitals anywhere */
.eyebrow,.step-l,.fset-h,.fact small,.dlong small,.side-label,.tree-h,.cw,.ud small,.cov-bday small,.proto,.remember small,.sample{text-transform:none!important;letter-spacing:0!important}
.eyebrow{font-size:14px;font-weight:500;margin-bottom:2px}
.step-l{font-size:13.5px;font-weight:600;color:var(--ink)}
.fact small,.dlong small{font-size:12px;font-weight:500}
.side-label{font-size:12.5px;font-weight:600}
/* category tiles: quieter counts */
.bt-n{background:none!important;padding:0!important;font-size:13px;font-weight:600;color:color-mix(in srgb,var(--c) 35%,var(--muted))!important}
.bt b{font-size:15.5px}
/* capture: coloured dot on category choices */
.dot-chip{display:inline-flex;align-items:center;gap:7px}
.dot-chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.dot-chip[aria-pressed="true"]::before{background:#fff}
/* item page */
.d-title{font-size:24px;line-height:1.2;letter-spacing:-.015em;margin:8px 0 6px}
.d-crumb .chip-c{font-weight:600}
.hero-cap:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent),0 16px 40px -18px color-mix(in srgb,var(--accent) 45%,transparent)}
@media(max-width:600px){
 /* compact category rows on phone: icon, name, count */
 .bento{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px}
 .bt{min-height:0!important;flex-direction:row!important;align-items:center;gap:10px;padding:10px!important;border-radius:16px}
 .bt .bt-top{order:0;flex:none}
 .bt .bt-top .bt-n{display:none}
 .bt-ic{width:34px;height:34px;border-radius:10px}
 .bt-ic svg{width:17px;height:17px}
 .bt b{padding:0!important;margin:0!important;font-size:14.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .bt .bt-last{display:none}
 .bt-add .bt-add-ic{width:34px;height:34px}
 .home-h{margin-top:14px}
 /* item page footer fits: secondary actions become icons */
 .sheet-foot{gap:8px}
 .sheet-foot .btn:not(.primary){flex:0 0 auto;width:46px;padding:0;font-size:0;gap:0;justify-content:center}
 .sheet-foot .btn:not(.primary) svg{width:19px;height:19px}
 .sheet-foot .btn.primary{flex:1}
 .sheet-foot #saveInbox,.sheet-foot [data-close].btn{width:auto;flex:1;font-size:14px;gap:7px;padding:0 12px}
}
.sidebar .side-cats .side-btn .d{background:var(--c)!important;opacity:1!important;filter:none!important;border:0!important;width:10px;height:10px;border-radius:50%;box-shadow:none}
@media(max-width:600px){.home-h{display:none}}

/* critique fixes */
@media(max-width:640px){.cv-actions>.cv-del{flex:0 0 44px;width:44px;padding:0}}
.fold-sug{margin:12px 0 4px}
@media(max-width:600px){
 .cv-uniform .grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
 .cv-uniform .grid .card{aspect-ratio:auto!important;display:flex!important;flex-direction:column;border-radius:14px!important;border:1px solid var(--line)!important;background:var(--surface)}
 .cv-uniform .grid .ph{position:relative!important;inset:auto!important;height:auto!important;aspect-ratio:4/3;flex:none}
 .cv-uniform .grid .card .body{position:static!important;background:none!important;padding:8px 10px 10px!important}
 .cv-uniform .grid .card b{color:var(--ink)!important;font-size:13.5px!important}
 .cv-uniform .grid .facts{color:var(--muted)!important}
 .bt b{white-space:normal!important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
}

/* accessibility fixes */
.bt .bt-last{color:color-mix(in srgb,var(--ink) 70%,transparent)!important}
.bt .bt-n{color:color-mix(in srgb,var(--ink) 68%,transparent)!important}
.cv-uniform .grid .card .body{background:linear-gradient(transparent,rgba(0,0,0,.72))}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<body>

<div class="toast" id="toast" role="status"></div>

<script>
const SRC0="<!doctype html>"+document.documentElement.outerHTML;
const IN_PHONE=(()=>{try{return !!(window.frameElement&&window.frameElement.id==="phoneFrame")}catch(e){return false}})();
const CATS=[
 {id:"places",name:"Places",icon:"map-pin",c:"#2a9d8f"},
 {id:"restaurants",name:"Restaurants",icon:"utensils",c:"#e76f51"},
 {id:"cafes",name:"Cafes",icon:"coffee",c:"#b07a4f"},
 {id:"shopping",name:"Shopping",icon:"shopping-bag",c:"#d14d8b"},
 {id:"recipes",name:"Recipes",icon:"chef-hat",c:"#f08a24"},
 {id:"products",name:"Products",icon:"package",c:"#8a5cd1"},
 {id:"shows",name:"Shows & Movies",icon:"tv",c:"#4f63d6"},
 {id:"books",name:"Books",icon:"book-open",c:"#9b4f96"},
 {id:"gifts",name:"Gifts",icon:"gift",c:"#d64545"},
 {id:"people",name:"People",icon:"user-round",c:"#3a8fd1"},
 {id:"ideas",name:"Ideas",icon:"lightbulb",c:"#d9a514"},
 {id:"home",name:"Home",icon:"sofa",c:"#4c9a5b"},
 {id:"events",name:"Events",icon:"calendar-heart",c:"#c2408f"},
 {id:"birthdays",name:"Birthdays",icon:"cake",c:"#ff9ec4"},
 {id:"lifeadmin",name:"Life admin",icon:"clipboard-list",c:"#93b5e1"},
 {id:"subscriptions",name:"Subscriptions",icon:"repeat",c:"#f7a8a0"}];
const catById=id=>CATS.find(c=>c.id===id);
CATS.forEach((c,k)=>{c.k=k;c.n0=c.name});
const BAL=["#12a594","#e5484d","#b0712b","#d6409f","#f76b15","#6e56cf","#3e63dd","#8e4ec6","#e54666","#0090ff","#f5a524","#30a46c","#ab4aba","#e93d82","#4f6d8f","#7c66dc"];
const SORB=["#5fd3b0","#ff6b81","#ffa07a","#ff7eb6","#ffb347","#b39cff","#7f9cff","#c58be0","#ff8a8a","#6cc4f5","#ffd84d","#a8e07a","#f59ad3"];
const IDEAS=[["Wine","wine"],["Travel","plane"],["Date night","heart"],["Kids activities","baby"],["Workouts","dumbbell"],["Podcasts","podcast"],["Music","music"],["Beauty","sparkles"],["Fashion","shirt"],["Quotes","quote"],["Wish list","star"],["Pets","paw-print"],["Garden","flower-2"],["Hikes","mountain"]];
let ncCol=SORB[0];
function newCatIdeas(){const it=live();const empty=CATS.filter(c=>!it.some(i=>i.cat===c.id)&&!(S.active||[]).includes(c.id)).sort((a,b)=>a.name.localeCompare(b.name));const ideas=IDEAS.filter(d=>!CATS.some(c=>c.name.toLowerCase()===d[0].toLowerCase()));
 if(!empty.length&&!ideas.length)return "";return `<label class="f">Or pick a suggestion</label><div class="bt-empty" style="margin:0"><div>${empty.map(c=>`<button data-activate="${c.id}"><i data-lucide="${c.icon}"></i>${esc(c.name)}</button>`).join("")}${ideas.map(d=>`<button data-idea="${d[0]}"><i data-lucide="${d[1]}"></i>${d[0]}</button>`).join("")}</div></div>`}
function addCat(name,icon,col){if(CATS.some(c=>c.name.toLowerCase()===name.toLowerCase())){toast(name+" already exists");return false}const c={id:"c_"+Date.now(),name,icon:icon||"folder",c:col||SORB[CATS.length%SORB.length]};c.c0=c.c;CATS.push(c);S.active=[...(S.active||[]),c.id];S.customCats=[...(S.customCats||[]),{id:c.id,name,icon:c.icon,c:c.c}];save();render();toast(name+" added ✓",true);return true}
function newCat(pre){ncCol=SORB[CATS.length%SORB.length];openSheet(`<div class="sheet-h"><h2>New category</h2><button class="icon-btn" data-close aria-label="Close"><i data-lucide="x"></i></button></div><label class="f" for="nc-name">Name</label><input class="in" id="nc-name" value="${esc(pre||"")}" placeholder="e.g. Wine, Travel, Date night">${newCatIdeas()}<label class="f">Colour</label><div class="swatches">${SORB.map(c=>`<button class="swatch" data-ncc="${c}" style="background:${c}" aria-pressed="${c===ncCol}" aria-label="Colour"></button>`).join("")}</div><div class="save-row"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ncSave"><i data-lucide="check"></i>Add category</button></div>`);setTimeout(()=>{const n=$("#nc-name");if(n)n.focus()},250)}
const NONE={id:null,name:"Inbox",icon:"inbox",c:"#b98aa0"};
const day=864e5, now=Date.now();
const SAMPLES=[
 {title:"Dumpling place on Victoria Ave",cat:"restaurants",sub:"Chinese",place:"Victoria Ave, Chatswood",x:48,y:22,notes:"Saw the queue driving past. Try the pork soup dumplings.",rating:0,h:150,age:1,coll:["Weekend eats"]},
 {title:"Chicken laksa (from a reel)",cat:"recipes",link:"https://www.instagram.com/",notes:"Ingredients are in the caption. Uses coconut milk + laksa paste.",rating:5,h:190,age:2},
 {title:"Vitamin C serum Mia recommended",cat:"shopping",sub:"Skincare",notes:"About $45. Mia said use it in the morning.",rating:0,h:130,age:3,coll:["Christmas gifts"]},
 {title:"Corner café with the green awning",cat:"cafes",place:"Darling St, Balmain",x:30,y:55,notes:"Looked cosy. Dog friendly?",rating:0,h:170,age:4,coll:["Weekend eats"]},
 {title:"Screenshot from Facebook",cat:null,notes:"Haven't sorted this yet.",h:140,age:0},
 {title:"Spy drama Jess recommended",cat:"shows",sub:"Streaming",notes:"Jess said stick with it past episode 2.",rating:0,h:120,age:6},
 {title:"Candle Mum liked at the markets",cat:"gifts",notes:"Fig scent. Stall near the entrance.",h:160,age:8,coll:["Christmas gifts"]},
 {title:"Lookout with the harbour view",cat:"places",place:"Balmoral",x:68,y:38,notes:"Go at sunset.",rating:4,h:200,age:10},
 {title:"Hallway paint colour",cat:"home",notes:"Warm white, low sheen.",h:110,age:12},
 {title:"Night markets, first Friday",cat:"events",place:"Parramatta",x:14,y:40,notes:"Starts 5pm.",h:140,age:14},
 {title:"Book from the podcast",cat:"books",notes:"Memoir about starting a bakery.",h:150,age:20},
 {title:"Weekend market stall idea",cat:"ideas",notes:"Pressed flower bookmarks?",h:120,age:25}
].map((s,i)=>({id:"s"+i,sub:"",link:"",img:null,place:"",rating:0,coll:[],been:false,deleted:null,sample:true,...s,created:now-s.age*day}));

let S;
const KEY="remember-that-v1";const IMG=new Map();let idb=null;
function idbOpen(){return new Promise(r=>{try{const q=indexedDB.open("rt-images",1);q.onupgradeneeded=()=>q.result.createObjectStore("img");q.onsuccess=()=>{idb=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function idbPut(k,v){try{idb&&idb.transaction("img","readwrite").objectStore("img").put(v,k)}catch(e){}}
function idbDel(k){try{idb&&idb.transaction("img","readwrite").objectStore("img").delete(k)}catch(e){}}
function idbAll(){return new Promise(r=>{if(!idb)return r();try{const rq=idb.transaction("img").objectStore("img").openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){IMG.set(c.key,c.value);c.continue()}else r()};rq.onerror=()=>r()}catch(e){r()}})}
function load(){try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
 if(!S)S={items:[],collections:[],accent:"white",palette:"sorbet",catLayout:"grid",layout:"grid",active:CATS.map(c=>c.id)};S.style="clean";}
function writeLocal(){const items=S.items.map(i=>{if(i.img&&i.img.startsWith("data:")){if(IMG.get(i.id)!==i.img){IMG.set(i.id,i.img);idbPut(i.id,i.img)}return {...i,img:"idb"}}if(!i.img&&IMG.has(i.id)){IMG.delete(i.id);idbDel(i.id)}return i});
 try{localStorage.setItem(KEY,JSON.stringify({...S,items}))}catch(e){try{toast("Storage is full. Try removing some photos.")}catch(x){}}}
const SNAP=new Map();let SNAPM="";
function ikey(i){return JSON.stringify({...i,img:i.img?(i.img.startsWith("data:")?"d"+i.img.length+i.img.slice(-16):i.img==="cloud"?"d":i.img):null,u:0,cimg:0})}
function mkey(){const {items,mu,...m}=S;return JSON.stringify(m)}
function resnap(){SNAP.clear();S.items.forEach(i=>SNAP.set(i.id,ikey(i)));SNAPM=mkey()}
function stamp(){const now=Date.now();S.items.forEach(i=>{const k=ikey(i);if(SNAP.get(i.id)!==k){i.u=now;SNAP.set(i.id,k)}});const m=mkey();if(m!==SNAPM){S.mu=now;SNAPM=m}}
function save(){stamp();writeLocal();schedulePush()}
load();
["lifeadmin","subscriptions"].forEach(id=>{S.seenCats=S.seenCats||[];if(!S.seenCats.includes(id)){S.active=[...new Set([...(S.active||[]),id])];S.seenCats.push(id)}});
(S.customCats||[]).forEach(c=>{if(!catById(c.id))CATS.push({...c,c0:c.c})});
S.active=[...new Set([...(S.active||[]),...(S.customCats||[]).map(c=>c.id)])];
CATS.splice(0,CATS.length,...CATS.filter(c=>!(c.id.startsWith("c_")&&(S.hiddenCats||[]).includes(c.id))));

let lastPt=null,relBase=null,sel=null,lpFired=false,lpT=null;
function withRel(f){relBase=ctx&&ctx.sub||"";try{return f()}finally{relBase=null}}
let view="home", ctx=null, mapFilter=null, mapSel=null, q="", sFilter=null, sRating=0;
const $=s=>document.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const live=()=>S.items.filter(i=>!i.deleted);
const catOf=i=>i.cat?catById(i.cat):NONE;
const icons=()=>{try{lucide.createIcons()}catch(e){}};
function applyAccent(){document.documentElement.dataset.font=S.font||"modern";CATS.forEach(c=>{if(c.c0===undefined)c.c0=c.c;if(c.k!==undefined){if(S.palette==="classic")c.c=c.c0;else if(S.palette==="balanced"&&BAL[c.k])c.c=BAL[c.k];else if(c.k<13)c.c=SORB[c.k]}const e=(S.catEdit||{})[c.id];if(e){if(e.name)c.name=e.name;if(e.c)c.c=e.c}});document.documentElement.dataset.pal=S.palette||"classic";document.documentElement.dataset.accent=S.accent;document.documentElement.dataset.style=S.style||"classic"}

function greeting(){const n=new Date(),h=n.getHours(),wd=n.getDay();
  const P=h<5?["Still up","?"]:h<12?["Good morning",""]:h<17?["Good afternoon",""]:h<22?["Good evening",""]:["Night owl mode",""];const t=`${P[0]}, Chels${P[1]||"!"}`;
  const soon=live().filter(i=>i.cat==="birthdays"&&i.f&&i.f.date).map(i=>{const d=new Date(i.f.date+"T00:00");if(isNaN(d))return null;const nx=new Date(n.getFullYear(),d.getMonth(),d.getDate());const t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());if(nx<t0)nx.setFullYear(nx.getFullYear()+1);return [i,Math.round((nx-t0)/864e5)]}).filter(x=>x&&x[1]<=7).sort((a,b)=>a[1]-b[1])[0];
  if(soon){const nm=soon[0].title.replace(/[’']s birthday$/i,"");return {t,p:P,l:soon[1]===0?`It’s ${nm}’s birthday today 🎂`:`${nm}’s birthday is ${soon[1]===1?"tomorrow":"in "+soon[1]+" days"} 🎂`}}
  const pool=h<5||h>=22?["Save it now, sleep on it later.","Late-night find? Pop it in before you forget."]:wd===5?["Weekend plans brewing? Save the spots.","Friday finds go here."]:wd===0||wd===6?["Weekend wanderings welcome.","Spotted something good today?"]:h<12?["What’s worth remembering today?","Fresh day, fresh finds."]:["Saw something good? Pop it in.","Future Chels will thank you.","Your brain, but pinker.","Nothing forgotten on our watch."];
  return {t,p:P,l:pool[n.getDate()%pool.length]}}

function coverType(i){const cv=i.cover||{};if(cv.type&&cv.type!=="auto")return cv.type;if(i.place)return "map";if(i.cat&&catKey(i.cat)==="quotes")return "text";return "icon"}
function niceDate(v){try{const d=new Date(v+"T00:00");return isNaN(d)?v:d.toLocaleDateString("en-AU",{day:"numeric",month:"long"})}catch(e){return v}}
function ph(i,h){const c=catOf(i);if(!i.img&&i.cat==="birthdays"&&i.f&&i.f.date&&h>=80)return `<div class="ph cov-text cov-bday" style="--c:${(i.cover&&i.cover.color)||c.c};height:${h}px"><span><small>${esc(niceDate(i.f.date))}</small>${esc(i.title)}</span></div>`;if(i.img&&i.img!=="cloud")return `<div class="ph" style="--c:${c.c};height:${h}px"><img src="${i.img}" alt=""></div>`;let t=coverType(i);const col=(i.cover&&i.cover.color)||c.c;
 if(t==="text"&&h<80)t="icon";if(t==="map"&&(!i.place||relBase!==null))t="icon";
 if(t==="text")return `<div class="ph cov-text" style="--c:${col};height:${h}px"><span>${esc(i.title)}</span></div>`;
 if(t==="map")return `<div class="ph cov-map" style="--c:${col};height:${h}px">${MAPSVG}<span class="pin" style="--c:${col};left:${i.x||50}%;top:${Math.max(32,i.y||45)}%"><i data-lucide="${c.icon}"></i></span></div>`;
 return `<div class="ph ${t==="pattern"?"cov-pat":"cov-icon"}" style="--c:${col};height:${h}px"><i data-lucide="${c.icon}"></i></div>`}
let covOpenD=false,detailEdit=false;
function coverPicker(o,pref){const cv=o.cover||{};const fid=pref==="d"?"d-img":"cov-img";
 return `<div class="covbox"><label class="f" style="margin-top:6px">Cover</label><p class="note" style="margin:0 0 8px">Pick a colour, or use your own image.</p><div class="cov-row"><div class="swatches sm" data-cov="${pref}">${SORB.map(x=>`<button type="button" class="swatch" data-covc="${x}" style="background:${x}" aria-pressed="${cv.color===x}" aria-label="Cover colour"></button>`).join("")}</div><label class="sg ghost cov-up" for="${fid}"><i data-lucide="image-plus"></i>Upload image</label><input type="file" id="${fid}" accept="image/*" hidden></div></div>`}
function card(i){const c=catOf(i);const rel=relBase!==null&&i.sub&&i.sub!==relBase?(relBase?i.sub.slice(relBase.length+3):i.sub):"";const pinMode=S.style==="pin"&&(view==="home"||S.layout==="grid");return `<button class="card${sel&&sel.has(i.id)?" picked":""}" data-open="${i.id}" draggable="true">${sel?`<span class="selck"><i data-lucide="check"></i></span>`:""}<span class="pin-save">Open</span>${ph(i,pinMode?Math.round(i.h*1.35):S.layout==="grid"?i.h:56)}<div class="body"><b>${esc(i.title)}</b>${facts(i)?`<div class="facts">${esc(facts(i))}</div>`:""}<div class="meta">${i.remind?`<span class="rem" title="Reminder set"><i data-lucide="bell"></i></span>`:""}${relBase!==null?(rel?`<span class="fpill"><i data-lucide="folder"></i>${esc(rel)}</span>`:""):`<span class="chip-c" style="--c:${c.c}">${esc(i.sub||c.name)}</span>`}${i.rating?`<span class="stars">${"★".repeat(i.rating)}</span>`:""}${i.sample?`<span class="sample">Sample</span>`:""}</div></div></button>`}
const EMPTY={places:["Nowhere saved yet","Next time somewhere catches your eye, drop a pin."],restaurants:["No restaurants yet","Heard about a good one? Save it before the name slips away."],cafes:["No cafes yet","Your next favourite flat white is out there."],shopping:["No shops yet","Save the little shops you don’t want to lose."],recipes:["No recipes yet","Screenshot it, save it, cook it one day."],products:["No products yet","Things you’re eyeing, all in one place."],shows:["Nothing to watch yet","Save the shows people won’t stop talking about."],books:["No books yet","Your to-read pile starts here."],gifts:["No gift ideas yet","Hear someone wish for something? Save it quietly."],people:["No one here yet","Little details about people you care about."],ideas:["No ideas yet","Shower thoughts welcome."],home:["Nothing for home yet","Paint colours, plants, that lamp you liked."],events:["No events yet","Gigs, markets and dates to look forward to."],birthdays:["No birthdays yet","Add one and never miss a card again."],lifeadmin:["Life admin is clear","Where things are, what’s due, who to call."],subscriptions:["No subscriptions yet","Track what you pay for and when it renews."]};
function emptyState(msg){const k=view==="list"&&ctx&&ctx.cat&&ctx.cat!=="__inbox"?ctx.cat:null;const c=k?catById(k):null;const e=k&&EMPTY[k];
 if(msg)return `<div class="empty"><span class="empty-ic"><i data-lucide="search-x"></i></span><b>${msg}</b>Try fewer words, or a different filter.</div>`;
 if(view==="list"&&ctx&&ctx.cat==="__inbox")return `<div class="empty"><span class="empty-ic"><i data-lucide="party-popper"></i></span><b>Inbox zero!</b>Everything’s sorted. Nice work.</div>`;
 return `<div class="empty"><span class="empty-ic" style="--c:${c?c.c:"var(--accent)"}"><i data-lucide="${c?c.icon:"sparkles"}"></i></span><b>${e?e[0]:"Nothing here yet"}</b>${e?e[1]+" ":""}Tap the pink + to save one.</div>`}
function savedMsg(cat){const n=live().length,MS=[10,25,50,100,250,500,1000];if(MS.includes(n))return `${n} saves! 🎉 Future Chels is very grateful`;
 const tail=["✓","✓ Got it","✓ Safe and sound","✓ Remembered"][n%4];return "Saved to "+(cat?catById(cat).name:"Inbox")+" "+tail}
function cards(arr,emptyMsg){if(!arr.length)return emptyState(emptyMsg);
  return `<div class="${S.layout==="grid"?"grid":"list"}">${arr.map(card).join("")}</div>`}
function layoutSeg(){return `<div class="seg"><button aria-pressed="${S.layout==="grid"}" data-layout="grid" aria-label="Image cards"><i data-lucide="layout-grid"></i></button><button aria-pressed="${S.layout==="list"}" data-layout="list" aria-label="Compact list"><i data-lucide="list"></i></button></div>`}
const byNew=a=>[...a].sort((x,y)=>y.created-x.created);

function topbar(title,sub){return `<div class="top"><div class="hello">${title}${sub?`<p>${sub}</p>`:""}</div><button class="cta" data-capture><i data-lucide="plus"></i>Capture</button><button class="icon-btn m-only" data-go="settings" aria-label="Settings"><i data-lucide="settings"></i></button></div>`}

function pinHome(g,it,inbox){return `<div class="pin-top"><div class="brand-m"><i data-lucide="message-circle-heart"></i></div><label class="searchbar" style="flex:1;margin:0;min-width:0"><span class="ico"><i data-lucide="search"></i></span><input id="homeSearch" aria-label="Search your saves" placeholder="Search your saves" autocomplete="off"></label><button class="cta" data-capture><i data-lucide="plus"></i>Capture</button><button class="icon-btn m-only" data-go="settings" aria-label="Settings"><i data-lucide="settings"></i></button></div>
